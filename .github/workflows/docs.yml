name: docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOXYGEN_VERSION: "1.14.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not apt's. Whatever version the runner image happens to ship
      # will differ from the one the Doxyfile and the comments were written
      # against, and the versions disagree about what deserves a warning --
      # 1.9.8 autolinks `::name()` inside a code span where 1.14 does not.
      # Since warnings fail this build, that difference broke docs twice for
      # reasons invisible locally. Pin it so local and CI agree.
      - name: Install doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          v="${{ env.DOXYGEN_VERSION }}"
          url="https://github.com/doxygen/doxygen/releases/download/Release_${v//./_}/doxygen-$v.linux.bin.tar.gz"
          curl -fsSL "$url" -o doxygen.tar.gz
          tar xzf doxygen.tar.gz
          sudo cp "doxygen-$v/bin/doxygen" /usr/local/bin/
          doxygen --version

      # Warnings are failures: an unescaped XML tag in a comment silently
      # mangles the rendered page rather than erroring. Config-level warnings
      # are exempt, because this doxygen is whatever apt ships and need not
      # match the one the Doxyfile was written against; a version disagreement
      # about a config tag is not a defect in the documentation.
      - name: Generate
        run: |
          doxygen --version
          # doxygen will not create a nested output directory, and a fresh
          # checkout has no build/ at all. It only ever worked locally because
          # cmake had already made one.
          mkdir -p build/doc
          doxygen docs/Doxyfile 2>warnings.txt || true
          cat warnings.txt
          grep -vE "(obsolete|Unknown tag|unsupported tag|ignoring unsupported)" warnings.txt > real.txt || true
          if [ -s real.txt ]; then
            echo "::error::doxygen reported documentation warnings"
            exit 1
          fi
          test -f build/doc/html/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/doc/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
