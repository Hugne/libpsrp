name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_MINGW_VERSION: "20260826"

jobs:
  msvc:
    name: MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # build.bat locates Visual Studio with vswhere when its local path is
      # absent, so it needs no CI-specific arguments.
      - name: Build and test
        shell: cmd
        run: scripts\build.bat

  clang:
    name: clang (llvm-mingw)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache llvm-mingw
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ucrt-x86_64

      - name: Install llvm-mingw
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $v = "${{ env.LLVM_MINGW_VERSION }}"
          $name = "llvm-mingw-$v-ucrt-x86_64"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/$name.zip"
          Invoke-WebRequest $url -OutFile llvm.zip -UseBasicParsing
          Expand-Archive llvm.zip -DestinationPath C:\llvm-tmp
          Move-Item "C:\llvm-tmp\$name" C:\llvm-mingw

      - name: Build and test
        shell: cmd
        env:
          LLVM_MINGW_DIR: C:\llvm-mingw
        run: scripts\build-clang.bat

  hygiene:
    name: no local config
    runs-on: ubuntu-latest
    # The live tests take their endpoint and credentials from the environment
    # precisely so none of it has to be written down in a public repository.
    # This checks that rather than trusting it.
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-no-local-config.sh

  linux:
    name: Linux (partial port)
    runs-on: ubuntu-latest
    # The protocol core is platform-free and builds here behind the same seams
    # Windows uses, with libxml2, OpenSSL, a POSIX RNG and the curl transport.
    # Still a subset -- disconnect, reconnect and enumeration are not ported --
    # but it is what stops the portability claim drifting back into being
    # aspirational, and it runs the crypto tests against the second backend.
    #
    # The live leg cannot run here: a Linux runner has no WinRM server to talk
    # to, so test_curl_open skips itself. It is verified against a real server
    # locally instead (TODO PSRP-35).
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libxml2-dev libssl-dev libcurl4-openssl-dev libkrb5-dev gss-ntlmssp

      - name: Build
        run: |
          cmake -G Ninja -S . -B build/linux -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/linux

      - name: Test
        run: ctest --test-dir build/linux --output-on-failure

  valgrind:
    name: valgrind (Linux)
    runs-on: ubuntu-latest
    # What the Linux port bought us. The Windows build has had debug-CRT leak
    # checking for a while, but nothing was watching for reads of uninitialised
    # memory or invalid accesses; memcheck does, and the parsers are where that
    # would matter, since they are the code a hostile server reaches directly.
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxml2-dev libssl-dev libcurl4-openssl-dev libkrb5-dev valgrind

      - name: Build
        run: |
          cmake -G Ninja -S . -B build/vg -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/vg

      # Any output on stderr is also a failure: a library has no business
      # writing to a caller's terminal, and libxml2 does exactly that on
      # malformed input unless told not to.
      - name: memcheck every test
        run: |
          fail=0
          for t in build/vg/tests/test_* build/vg/tests/fuzz_*; do
            [ -x "$t" ] || continue
            case "$t" in *.*) continue;; esac
            err=$(valgrind --error-exitcode=42 --leak-check=full --track-origins=yes --show-leak-kinds=definite,indirect --errors-for-leak-kinds=definite,indirect --suppressions=tests/valgrind.supp --quiet "$t" 2>&1 >/dev/null) || fail=1
            if [ -n "$err" ]; then
              echo "::error::$(basename $t) reported: $err"
              fail=1
            else
              echo "ok $(basename $t)"
            fi
          done
          exit $fail

      - name: memcheck a parser soak
        env:
          PSRP_FUZZ_ITERATIONS: "100000"
        run: |
          for seed in 1 2; do
            PSRP_FUZZ_SEED=$seed valgrind --error-exitcode=42 --leak-check=full --errors-for-leak-kinds=definite,indirect --suppressions=tests/valgrind.supp --quiet build/vg/tests/fuzz_parsers >/dev/null
          done

  interop:
    name: interop (live WinRM)
    runs-on: windows-latest
    # Unit tests prove an encoding; only a live server proves a feature is
    # reachable. The runner is its own PSRP server: it enables remoting on
    # itself and the suite drives it over localhost. Observed passing on a
    # hosted runner, so this gates like any other job (PSRP-31).
    steps:
      - uses: actions/checkout@v4

      - name: Enable PowerShell remoting on the runner
        shell: pwsh
        run: |
          Enable-PSRemoting -Force -SkipNetworkProfileCheck
          winrm get winrm/config/service
          Test-WSMan -ComputerName localhost
          # Prove the endpoint really runs a pipeline before blaming libpsrp
          # for anything that fails afterwards.
          Invoke-Command -ComputerName localhost -ScriptBlock { $PSVersionTable.PSVersion }

      - name: Build
        shell: cmd
        run: scripts\build.bat

      # No credentials: the config's default endpoint is localhost:5985 and a
      # NULL username authenticates the current user over Negotiate, so there
      # is no secret to store.
      - name: Run the interop suite
        shell: cmd
        env:
          PSRP_INTEROP: "1"
        run: ctest --test-dir build\msvc -L interop --output-on-failure
